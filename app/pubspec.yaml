name: unleash_your_brave
description: Unleash Your Brave — Flutter mobile client
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Routing
  go_router: ^14.8.1

  # Dependency injection
  get_it: ^8.0.3

  # Functional helpers (Either / Failure)
  dartz: ^0.10.1

  # Local storage
  shared_preferences: ^2.5.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Typography (Playfair Display + Inter)
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

  # Chat dependencies
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  http: ^1.2.2
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.10.0
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  keyboard_actions: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/launcher_icon_square.png
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/launcher_icon_square.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
